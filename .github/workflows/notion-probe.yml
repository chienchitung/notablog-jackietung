name: Notion API probe

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/notion-probe.yml'
      - 'tools/notion-probe.mjs'
      - 'src/**'
      - 'patches/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe Notion API variants
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          PROBE_ROUNDS: '8'
        run: node tools/notion-probe.mjs

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build generator
        run: npm run build:module
      - name: Generate website from Notion (no publish)
        run: npm run sync:fresh
      - name: Validate generated website
        run: node tools/validate-site.mjs
      - name: Compare with last published website
        run: |
          git add -A -- notablog-starter/public
          echo "Changed files vs last published site:"
          git diff --cached --stat -- notablog-starter/public | tail -25
          echo "HTML pages generated: $(find notablog-starter/public -name '*.html' | wc -l)"
          echo "Unknown mentions: $(grep -rl 'Unknown Page\|Unknown Notion User' notablog-starter/public | wc -l)"
